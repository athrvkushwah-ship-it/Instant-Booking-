name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]   # Triggers AFTER CI Pipeline completes
    types:
      - completed
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Only if CI passed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            athrvkush/ticket-booking:latest
            athrvkush/ticket-booking:${{ github.event.workflow_run.head_sha }}